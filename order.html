<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заявка — Converse Shop</title>
    <!-- Локальное подключение Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- Свои стили -->
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body class="bg-light">
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-brand-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Converse Shop</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Главная</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="catalog.html">Каталог</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product.html">Товар</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="order.html">Заявка</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="card shadow-sm border-0">
            <!-- Шапка формы в фирменном цвете -->
            <div class="card-header bg-brand-dark text-white py-3">
              <h1 class="h4 mb-0">Форма заявки</h1>
            </div>

            <div class="card-body p-4">
              <div class="alert alert-info" role="alert">
                Заполните форму. Поля со звёздочкой обязательны.
              </div>

              <!-- Обычная форма. Валидация будет проверяться браузером, 
                   а по нажатию на кнопку откроется модальное окно -->
              <form id="orderForm">
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="order-name" class="form-label">Имя *</label>
                    <input
                      id="order-name"
                      name="name"
                      type="text"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="order-email" class="form-label">E-mail *</label>
                    <input
                      id="order-email"
                      name="email"
                      type="email"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="order-phone" class="form-label">Телефон</label>
                    <div class="input-group">
                      <span class="input-group-text">+7</span>
                      <input
                        id="order-phone"
                        name="phone"
                        type="tel"
                        class="form-control"
                        placeholder="900 000-00-00"
                      />
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="order-product" class="form-label">Товар</label>
                    <select
                      id="order-product"
                      name="product"
                      class="form-select"
                    >
                      <option selected value="">Выберите товар</option>
                      <option value="chuck-70">Chuck 70</option>
                      <option value="all-star-low">All Star Low</option>
                      <option value="run-star-hike">Run Star Hike</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <label for="order-comment" class="form-label"
                      >Комментарий</label
                    >
                    <textarea
                      id="order-comment"
                      name="comment"
                      class="form-control"
                      rows="4"
                    ></textarea>
                  </div>

                  <div class="col-12">
                    <div class="form-check">
                      <input
                        id="order-agree"
                        name="agree"
                        class="form-check-input"
                        type="checkbox"
                        required
                      />
                      <label class="form-check-label" for="order-agree">
                        Я согласен на обработку данных *
                      </label>
                    </div>
                  </div>

                  <div class="col-12 d-flex gap-2 mt-4">
                    <!-- Кнопка открывает модалку (но форма проверит required) -->
                    <button
                      class="btn btn-brand px-4"
                      type="submit"
                      data-bs-toggle="modal"
                      data-bs-target="#successModal"
                    >
                      Отправить заявку
                    </button>
                    <button class="btn btn-outline-dark" type="reset">
                      Очистить
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Модальное окно успеха -->
    <div
      class="modal fade"
      id="successModal"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-brand-dark text-white">
            <h5 class="modal-title" id="successModalLabel">Успех!</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Закрыть"
            ></button>
          </div>
          <div class="modal-body text-center py-4">
            <h4 class="mb-3">Заявка отправлена! 🎉</h4>
            <p class="text-muted">
              Мы свяжемся с вами в ближайшее время для подтверждения заказа.
            </p>
          </div>
          <div class="modal-footer justify-content-center border-0 pb-4">
            <button
              type="button"
              class="btn btn-brand px-4"
              data-bs-dismiss="modal"
            >
              Отлично
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container">
        <div class="row align-items-center g-3">
          <div class="col-12 col-md-6">
            <p class="mb-0">&copy; 2026 Converse Shop.</p>
          </div>
          <div class="col-12 col-md-6 text-md-end">
            <a class="text-white text-decoration-none me-3" href="catalog.html"
              >Каталог</a
            >
            <a class="text-white text-decoration-none" href="order.html"
              >Заявка</a
            >
          </div>
        </div>
      </div>
    </footer>

    <!-- Локальное подключение JS Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
